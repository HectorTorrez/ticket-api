AWSTemplateFormatVersion: "2010-09-09"
Description: Tide Tickets MVP — VPC, RDS, ALB, ASG (Free Tier sizing)

Parameters:
  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate ARN in us-east-1 (leave empty until ISSUED)
  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 8
  JwtAccessSecret:
    Type: String
    NoEcho: true
    MinLength: 32
  JwtRefreshSecret:
    Type: String
    NoEcho: true
    MinLength: 32
  EcrImageUri:
    Type: String
    Default: 180294216289.dkr.ecr.us-east-1.amazonaws.com/ticket-api:latest
  AssetsBucketName:
    Type: String
    Default: tidetickets-assets-180294216289
  FrontendBaseUrl:
    Type: String
    Default: https://www.tidetickets.com
  CorsOrigins:
    Type: String
    Default: https://www.tidetickets.com,https://tidetickets.com
  TagOwner:
    Type: String
    Default: equipo-plataforma
  TagEnvironment:
    Type: String
    Default: prod
  TagCostCenter:
    Type: String
    Default: CC-4820
  TagDataClassification:
    Type: String
    Default: confidential

Conditions:
  HasIssuedCertificate: !Not [!Equals [!Ref CertificateArn, ""]]

Mappings:
  SubnetConfig:
    VPC:
      CIDR: 10.0.0.0/16
    Public1:
      CIDR: 10.0.1.0/24
      AZ: 0
    Public2:
      CIDR: 10.0.2.0/24
      AZ: 1
    Private1:
      CIDR: 10.0.10.0/24
      AZ: 0
    Private2:
      CIDR: 10.0.11.0/24
      AZ: 1

Resources:
  TicketVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !FindInMap [SubnetConfig, VPC, CIDR]
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: ticket-vpc
        - Key: owner
          Value: !Ref TagOwner
        - Key: environment
          Value: !Ref TagEnvironment
        - Key: cost-center
          Value: !Ref TagCostCenter
        - Key: data-classification
          Value: !Ref TagDataClassification

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: ticket-igw
        - Key: owner
          Value: !Ref TagOwner
        - Key: environment
          Value: !Ref TagEnvironment
        - Key: cost-center
          Value: !Ref TagCostCenter
        - Key: data-classification
          Value: !Ref TagDataClassification

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref TicketVpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TicketVpc
      CidrBlock: !FindInMap [SubnetConfig, Public1, CIDR]
      AvailabilityZone: !Select
        - !FindInMap [SubnetConfig, Public1, AZ]
        - !GetAZs ""
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: ticket-public-1
        - Key: owner
          Value: !Ref TagOwner
        - Key: environment
          Value: !Ref TagEnvironment
        - Key: cost-center
          Value: !Ref TagCostCenter
        - Key: data-classification
          Value: !Ref TagDataClassification

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TicketVpc
      CidrBlock: !FindInMap [SubnetConfig, Public2, CIDR]
      AvailabilityZone: !Select
        - !FindInMap [SubnetConfig, Public2, AZ]
        - !GetAZs ""
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: ticket-public-2
        - Key: owner
          Value: !Ref TagOwner
        - Key: environment
          Value: !Ref TagEnvironment
        - Key: cost-center
          Value: !Ref TagCostCenter
        - Key: data-classification
          Value: !Ref TagDataClassification

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TicketVpc
      CidrBlock: !FindInMap [SubnetConfig, Private1, CIDR]
      AvailabilityZone: !Select
        - !FindInMap [SubnetConfig, Private1, AZ]
        - !GetAZs ""
      Tags:
        - Key: Name
          Value: ticket-private-1
        - Key: owner
          Value: !Ref TagOwner
        - Key: environment
          Value: !Ref TagEnvironment
        - Key: cost-center
          Value: !Ref TagCostCenter
        - Key: data-classification
          Value: !Ref TagDataClassification

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref TicketVpc
      CidrBlock: !FindInMap [SubnetConfig, Private2, CIDR]
      AvailabilityZone: !Select
        - !FindInMap [SubnetConfig, Private2, AZ]
        - !GetAZs ""
      Tags:
        - Key: Name
          Value: ticket-private-2
        - Key: owner
          Value: !Ref TagOwner
        - Key: environment
          Value: !Ref TagEnvironment
        - Key: cost-center
          Value: !Ref TagCostCenter
        - Key: data-classification
          Value: !Ref TagDataClassification

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref TicketVpc
      Tags:
        - Key: Name
          Value: ticket-public-rt
        - Key: owner
          Value: !Ref TagOwner
        - Key: environment
          Value: !Ref TagEnvironment
        - Key: cost-center
          Value: !Ref TagCostCenter
        - Key: data-classification
          Value: !Ref TagDataClassification

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref TicketVpc
      Tags:
        - Key: Name
          Value: ticket-private-rt
        - Key: owner
          Value: !Ref TagOwner
        - Key: environment
          Value: !Ref TagEnvironment
        - Key: cost-center
          Value: !Ref TagCostCenter
        - Key: data-classification
          Value: !Ref TagDataClassification

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB HTTP/HTTPS ingress
      VpcId: !Ref TicketVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: ticket-alb-sg
        - Key: owner
          Value: !Ref TagOwner
        - Key: environment
          Value: !Ref TagEnvironment
        - Key: cost-center
          Value: !Ref TagCostCenter
        - Key: data-classification
          Value: !Ref TagDataClassification

  Ec2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: API from ALB only
      VpcId: !Ref TicketVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: ticket-ec2-sg
        - Key: owner
          Value: !Ref TagOwner
        - Key: environment
          Value: !Ref TagEnvironment
        - Key: cost-center
          Value: !Ref TagCostCenter
        - Key: data-classification
          Value: !Ref TagDataClassification

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL from API only
      VpcId: !Ref TicketVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref Ec2SecurityGroup
      Tags:
        - Key: Name
          Value: ticket-rds-sg
        - Key: owner
          Value: !Ref TagOwner
        - Key: environment
          Value: !Ref TagEnvironment
        - Key: cost-center
          Value: !Ref TagCostCenter
        - Key: data-classification
          Value: !Ref TagDataClassification

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for ticket-api RDS
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: ticket-db-subnets
        - Key: owner
          Value: !Ref TagOwner
        - Key: environment
          Value: !Ref TagEnvironment
        - Key: cost-center
          Value: !Ref TagCostCenter
        - Key: data-classification
          Value: !Ref TagDataClassification

  TicketDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: ticket-api-db
      Engine: postgres
      EngineVersion: "16.14"
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      StorageType: gp2
      MasterUsername: ticketadmin
      MasterUserPassword: !Ref DbPassword
      DBName: ticket_api
      VPCSecurityGroups:
        - !Ref RdsSecurityGroup
      DBSubnetGroupName: !Ref DbSubnetGroup
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      DeletionProtection: false
      AutoMinorVersionUpgrade: true
      Tags:
        - Key: Name
          Value: ticket-api-db
        - Key: owner
          Value: !Ref TagOwner
        - Key: environment
          Value: !Ref TagEnvironment
        - Key: cost-center
          Value: !Ref TagCostCenter
        - Key: data-classification
          Value: !Ref TagDataClassification

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: ticket-api-tg
      Port: 3000
      Protocol: HTTP
      VpcId: !Ref TicketVpc
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckPath: /api/v1/health
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: stickiness.enabled
          Value: "true"
        - Key: stickiness.type
          Value: lb_cookie
      Tags:
        - Key: Name
          Value: ticket-api-tg
        - Key: owner
          Value: !Ref TagOwner
        - Key: environment
          Value: !Ref TagEnvironment
        - Key: cost-center
          Value: !Ref TagCostCenter
        - Key: data-classification
          Value: !Ref TagDataClassification

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: AlbAccessLogsBucketPolicy
    Properties:
      Name: ticket-api-alb
      Scheme: internet-facing
      Type: application
      LoadBalancerAttributes:
        - Key: access_logs.s3.enabled
          Value: "true"
        - Key: access_logs.s3.bucket
          Value: !Ref AlbAccessLogsBucket
        - Key: access_logs.s3.prefix
          Value: alb
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: ticket-api-alb
        - Key: owner
          Value: !Ref TagOwner
        - Key: environment
          Value: !Ref TagEnvironment
        - Key: cost-center
          Value: !Ref TagCostCenter
        - Key: data-classification
          Value: !Ref TagDataClassification

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            Host: "#{host}"
            Path: "/#{path}"
            Query: "#{query}"
            StatusCode: HTTP_301

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasIssuedCertificate
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  Ec2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: Name
          Value: ticket-api-ec2-role
        - Key: owner
          Value: !Ref TagOwner
        - Key: environment
          Value: !Ref TagEnvironment
        - Key: cost-center
          Value: !Ref TagCostCenter
        - Key: data-classification
          Value: !Ref TagDataClassification
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: ticket-api-ec2-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource:
                  - !Sub arn:aws:s3:::${AssetsBucketName}/events/*
                  - !Sub arn:aws:s3:::${AssetsBucketName}/tickets/*
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt ApiLogGroup.Arn
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ticket-api/*
              - Sid: DenyRequestsOutsideUsEast1
                Effect: Deny
                Action: "*"
                Resource: "*"
                Condition:
                  StringNotEquals:
                    aws:RequestedRegion: us-east-1

  Ec2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref Ec2InstanceRole

  ApiLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: ticket-api-lt
      LaunchTemplateData:
        ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
        InstanceType: t3.micro
        IamInstanceProfile:
          Arn: !GetAtt Ec2InstanceProfile.Arn
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: true
            Groups:
              - !Ref Ec2SecurityGroup
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            dnf install -y docker awscli
            systemctl enable docker
            systemctl start docker
            aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
            DATABASE_URL=$(aws ssm get-parameter --name /ticket-api/database-url --with-decryption --query Parameter.Value --output text --region ${AWS::Region})
            JWT_ACCESS_SECRET=$(aws ssm get-parameter --name /ticket-api/jwt-access-secret --with-decryption --query Parameter.Value --output text --region ${AWS::Region})
            JWT_REFRESH_SECRET=$(aws ssm get-parameter --name /ticket-api/jwt-refresh-secret --with-decryption --query Parameter.Value --output text --region ${AWS::Region})
            docker pull ${EcrImageUri}
            docker rm -f ticket-api || true
            docker run -d --name ticket-api --restart unless-stopped -p 3000:3000 \
              --log-driver=awslogs \
              --log-opt awslogs-group=/ticket-api/ec2 \
              --log-opt awslogs-region=${AWS::Region} \
              --log-opt awslogs-stream=ticket-api \
              -e NODE_ENV=production \
              -e DATABASE_URL="$DATABASE_URL" \
              -e JWT_ACCESS_SECRET="$JWT_ACCESS_SECRET" \
              -e JWT_REFRESH_SECRET="$JWT_REFRESH_SECRET" \
              -e CORS_ORIGINS="${CorsOrigins}" \
              -e FRONTEND_BASE_URL="${FrontendBaseUrl}" \
              -e S3_BUCKET="${AssetsBucketName}" \
              -e S3_PUBLIC_BASE_URL="https://${AssetsBucketName}.s3.${AWS::Region}.amazonaws.com" \
              -e AWS_REGION="${AWS::Region}" \
              ${EcrImageUri}

  ApiAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: ticket-api-asg
      MinSize: 2
      MaxSize: 2
      DesiredCapacity: 2
      VPCZoneIdentifier:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      LaunchTemplate:
        LaunchTemplateId: !Ref ApiLaunchTemplate
        Version: !GetAtt ApiLaunchTemplate.LatestVersionNumber
      TargetGroupARNs:
        - !Ref ApiTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      Tags:
        - Key: Name
          Value: ticket-api
          PropagateAtLaunch: true
        - Key: owner
          Value: !Ref TagOwner
          PropagateAtLaunch: true
        - Key: environment
          Value: !Ref TagEnvironment
          PropagateAtLaunch: true
        - Key: cost-center
          Value: !Ref TagCostCenter
          PropagateAtLaunch: true
        - Key: data-classification
          Value: !Ref TagDataClassification
          PropagateAtLaunch: true

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ticket-api/ec2
      RetentionInDays: 7
      Tags:
        - Key: Name
          Value: ticket-api-logs
        - Key: owner
          Value: !Ref TagOwner
        - Key: environment
          Value: !Ref TagEnvironment
        - Key: cost-center
          Value: !Ref TagCostCenter
        - Key: data-classification
          Value: !Ref TagDataClassification

  AlbAccessLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub tidetickets-alb-logs-${AWS::AccountId}
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAlbLogs
            Status: Enabled
            ExpirationInDays: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      Tags:
        - Key: Name
          Value: ticket-alb-logs
        - Key: owner
          Value: !Ref TagOwner
        - Key: environment
          Value: !Ref TagEnvironment
        - Key: cost-center
          Value: !Ref TagCostCenter
        - Key: data-classification
          Value: !Ref TagDataClassification

  AlbAccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AlbAccessLogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AlbAccessLogsWrite
            Effect: Allow
            Principal:
              Service: logdelivery.elasticloadbalancing.amazonaws.com
            Action:
              - s3:PutObject
            Resource: !Sub ${AlbAccessLogsBucket.Arn}/alb/AWSLogs/${AWS::AccountId}/*
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
          - Sid: AlbAccessLogsAcl
            Effect: Allow
            Principal:
              Service: logdelivery.elasticloadbalancing.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt AlbAccessLogsBucket.Arn

  AlbTarget5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ticket-api-alb-target-5xx
      Tags:
        - Key: Name
          Value: ticket-alb-5xx-alarm
        - Key: owner
          Value: !Ref TagOwner
        - Key: environment
          Value: !Ref TagEnvironment
        - Key: cost-center
          Value: !Ref TagCostCenter
        - Key: data-classification
          Value: !Ref TagDataClassification
      AlarmDescription: ALB target 5xx responses
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt ApplicationLoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt ApiTargetGroup.TargetGroupFullName

  AlbUnhealthyHostsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ticket-api-alb-unhealthy-hosts
      Tags:
        - Key: Name
          Value: ticket-alb-unhealthy-alarm
        - Key: owner
          Value: !Ref TagOwner
        - Key: environment
          Value: !Ref TagEnvironment
        - Key: cost-center
          Value: !Ref TagCostCenter
        - Key: data-classification
          Value: !Ref TagDataClassification
      AlarmDescription: Unhealthy targets behind ALB
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt ApplicationLoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt ApiTargetGroup.TargetGroupFullName

  RdsCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ticket-api-rds-cpu
      Tags:
        - Key: Name
          Value: ticket-rds-cpu-alarm
        - Key: owner
          Value: !Ref TagOwner
        - Key: environment
          Value: !Ref TagEnvironment
        - Key: cost-center
          Value: !Ref TagCostCenter
        - Key: data-classification
          Value: !Ref TagDataClassification
      AlarmDescription: RDS CPU utilization high
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref TicketDatabase

  RdsFreeStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ticket-api-rds-free-storage
      Tags:
        - Key: Name
          Value: ticket-rds-storage-alarm
        - Key: owner
          Value: !Ref TagOwner
        - Key: environment
          Value: !Ref TagEnvironment
        - Key: cost-center
          Value: !Ref TagCostCenter
        - Key: data-classification
          Value: !Ref TagDataClassification
      AlarmDescription: RDS free storage below 2 GB
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2147483648
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref TicketDatabase

Outputs:
  VpcId:
    Value: !Ref TicketVpc
  AlbDnsName:
    Value: !GetAtt ApplicationLoadBalancer.DNSName
  AlbHostedZoneId:
    Value: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID
  RdsEndpoint:
    Value: !GetAtt TicketDatabase.Endpoint.Address
  TargetGroupArn:
    Value: !Ref ApiTargetGroup
  AsgName:
    Value: !Ref ApiAutoScalingGroup
